---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: activator
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - update
